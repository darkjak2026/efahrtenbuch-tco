<body>
<div class="page">
  <h1>Lade-Ring mit Statistik – fünf Ideen</h1>
  <p class="lead">Basis ist Variante 4 (Lade-Ring). Jede Idee zeigt auf einen Blick, wo der <b>aktuelle Monat</b> gegenüber <b>Vormonat</b>, <b>Minimum</b> und <b>Maximum</b> steht. <b>Antippen des Rings</b> öffnet für alle Kategorien den Text: aktueller Wert, Minimum und Maximum mit Datum sowie den Trendpfeil.</p>
  <div class="switch" id="sw"></div>
  <div class="layout">
    <div class="phone" id="phone"></div>
    <aside class="notes" id="notes"></aside>
  </div>
</div>

<script>
const ICONS = {
  laden: '<path d="M8 3v5M16 3v5"/><path d="M6 8h12v4a6 6 0 0 1-12 0V8Z"/><path d="M12 18v3"/>',
  leasing: '<path d="M3 9.5 12 4l9 5.5"/><path d="M4 9.5h16"/><path d="M6 12v6M10 12v6M14 12v6M18 12v6"/><path d="M3.5 20.5h17"/>',
  vers: '<path d="M12 3 5 6v5.5c0 4.4 3 8 7 9.5 4-1.5 7-5.1 7-9.5V6l-7-3Z"/><path d="m9 12 2.2 2.2L15.5 10"/>',
  abos: '<path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v4h-4"/><path d="M14.5 9.3a3.2 3.2 0 1 0 0 5.4"/><path d="M8.6 11h4.4M8.6 13h4"/>',
  invest: '<rect x="3" y="9" width="18" height="10" rx="2"/><path d="M8 9V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3"/><path d="M3 13h18"/><path d="M10.5 13v2.5M13.5 13v2.5"/>',
};
const PARTS = [
  { key: "laden", label: "Laden", color: "#4caf94" },
  { key: "leasing", label: "Leasing", color: "#7a63b0" },
  { key: "vers", label: "Versicherung", color: "#f0d84a" },
  { key: "abos", label: "Abos", color: "#e2664a" },
  { key: "invest", label: "Investitionen", color: "#8bc34a" },
];
const icon = (k, x, y, s, color = "#17141f", sw = 2.2) =>
  `<g transform="translate(${x - s / 2} ${y - s / 2}) scale(${s / 24})" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" pointer-events="none">${ICONS[k]}</g>`;
const svgIcon = (k, color, size = 13, sw = 2.2) => `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

// ---------- Beispielverlauf Juli–Oktober 2026 (frei erfunden) ----------
const MONTHS = [
  { key: "2026-07", end: "31.07.26", label: "Juli" },
  { key: "2026-08", end: "31.08.26", label: "August" },
  { key: "2026-09", end: "30.09.26", label: "September" },
  { key: "2026-10", end: "31.10.26", label: "Oktober" },
];
const HIST = {
  b10: { name: "BIO-Leapy", code: "B10", km: [380, 690, 820, 461],
    laden: [62.40, 88.90, 120.30, 95.11], leasing: [331.51, 331.51, 331.51, 331.51], vers: [78.40, 78.40, 78.40, 78.40], abos: [0, 0, 0, 0], invest: [18.06, 18.06, 18.06, 18.06] },
  t03: { name: "Leapy", code: "t03", km: [1310, 1580, 1190, 1249],
    laden: [151.20, 198.70, 160.40, 173.51], leasing: [149, 149, 149, 149], vers: [81.83, 81.83, 81.83, 81.83], abos: [2.99, 2.99, 2.99, 2.99], invest: [22.22, 22.22, 22.22, 22.22] },
};
const CUR = 3; // Oktober
const nf = (n, d = 2) => n.toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });

// Statistik je Kategorie: Euro + Anteil, Vormonat, Min/Max (mit Monatsletztem), Trend
function stats(k, idx = CUR) {
  const h = HIST[k];
  const totals = MONTHS.map((_, i) => PARTS.reduce((s, p) => s + h[p.key][i], 0));
  const out = {};
  for (const p of PARTS) {
    const eur = h[p.key].slice(0, idx + 1), pct = eur.map((v, i) => (totals[i] ? v / totals[i] : 0));
    const ext = (arr, cmp) => arr.reduce((b, v, i) => (cmp(v, arr[b]) ? i : b), 0);
    const minI = ext(eur, (a, b) => a < b), maxI = ext(eur, (a, b) => a > b);
    const minPI = ext(pct, (a, b) => a < b), maxPI = ext(pct, (a, b) => a > b);
    const prev3 = eur.slice(Math.max(0, idx - 3), idx), avg = prev3.length ? prev3.reduce((s, v) => s + v, 0) / prev3.length : null;
    const dev = avg ? (eur[idx] - avg) / avg : null;
    // je 5 % Abweichung 10°, höchstens 90°, unter 2,5 % waagerecht
    const deg = dev === null || Math.abs(dev) < 0.025 ? 0 : Math.max(-90, Math.min(90, Math.round(dev / 0.05) * 10));
    out[p.key] = {
      ...p, eur: eur[idx], pct: pct[idx], prevEur: idx ? eur[idx - 1] : null, prevPct: idx ? pct[idx - 1] : null,
      minEur: eur[minI], minPct: pct[minI], minDate: MONTHS[minI].end, maxEur: eur[maxI], maxPct: pct[maxI], maxDate: MONTHS[maxI].end,
      minPctV: pct[minPI], maxPctV: pct[maxPI], minPctDate: MONTHS[minPI].end, maxPctDate: MONTHS[maxPI].end, dev, deg, constant: eur[minI] === eur[maxI], series: eur, pctSeries: pct,
    };
  }
  const tco = totals[idx] / h.km[idx];
  return { parts: out, total: totals[idx], prevTotal: idx ? totals[idx - 1] : null, totals, km: h.km[idx], tco, ladenKm: h.laden[idx] / h.km[idx] };
}

// Trendpfeil: 0° = waagerecht (gleich), nach oben = teurer (rot), nach unten = günstiger (grün)
function arrow(deg, size = 22) {
  const color = deg > 0 ? "#e2664a" : deg < 0 ? "#4caf94" : "#a89fbf";
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><g transform="rotate(${-deg} 12 12)" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="m14 7 5 5-5 5"/></g></svg>`;
}

const pol = (cx, cy, r, deg) => { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
const arcPath = (cx, cy, r, a0, a1) => { const [x0, y0] = pol(cx, cy, r, a0), [x1, y1] = pol(cx, cy, r, a1); return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; };
function segList(st, useKey = "pct") {
  let acc = 0;
  return PARTS.filter((p) => st.parts[p.key].eur > 0).map((p) => {
    const s = st.parts[p.key], a0 = acc * 360; acc += s[useKey];
    return { ...s, a0, a1: acc * 360 };
  });
}
// Grundring wie Variante 4
function baseRing(st, cx, cy, r, w, k, badge = true) {
  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2a2038" stroke-width="${w}"/>`;
  for (const g of segList(st)) {
    const gap = g.pct > 0.03 ? 4 : 0.5, a0 = g.a0 + gap, a1 = Math.max(a0 + 0.5, g.a1 - gap);
    s += `<path class="seg" d="${arcPath(cx, cy, r, a0, a1)}" fill="none" stroke="${g.color}" stroke-width="${w}" stroke-linecap="round"/>`;
    if (badge && g.pct >= 0.05) { const [ix, iy] = pol(cx, cy, r, (g.a0 + g.a1) / 2); s += `<circle cx="${ix}" cy="${iy}" r="10" fill="#17141f" stroke="${g.color}" stroke-width="2"/>` + icon(g.key, ix, iy, 12, g.color, 2); }
  }
  return s;
}
const centerKm = (st, cx, cy) => `<text class="c1" x="${cx}" y="${cy + 2}" text-anchor="middle" font-size="15">${nf(st.km, 0)}</text><text class="c2" x="${cx}" y="${cy + 13}" text-anchor="middle">km im Monat</text>`;

let state = { v: "i1", sheet: null, focus: { b10: "laden", t03: "laden" } };

const IDEAS = {
  i1: {
    name: "1 · Schattenring",
    notes: `<h2>1 · Schattenring für den Vormonat</h2><p>Innen läuft ein dünner, blasser Ring mit der Aufteilung des <b>Vormonats</b>. So sieht man sofort, ob ein Segment gewachsen oder geschrumpft ist. Außen markieren kleine Klammern je Kategorie die Spanne von <b>Minimum bis Maximum</b> (Anteil in %), ein Punkt zeigt den aktuellen Wert darin.</p>
      <h3>Vorteile</h3><ul class="plus"><li>Bleibt nah an Variante 4, nur zwei feine Zusatzlinien</li><li>Vormonat-Vergleich ohne Lesen</li></ul><h3>Nachteile</h3><ul class="minus"><li>Klammern sind bei kleinen Segmenten (Abos) kaum zu sehen</li></ul>`,
    keys: `<span>innen blass = Vormonat</span><span>außen [ ] = Min–Max · ● aktuell</span>`,
    draw(st, k) {
      const cx = 80, cy = 78, r = 52, w = 13;
      let s = baseRing(st, cx, cy, r, w, k);
      // Vormonat als Schattenring
      let acc = 0;
      for (const p of PARTS) {
        const sp = st.parts[p.key]; if (!sp.prevPct) continue;
        const a0 = acc * 360 + 2, a1 = (acc + sp.prevPct) * 360 - 2; acc += sp.prevPct;
        if (a1 > a0) s += `<path d="${arcPath(cx, cy, r - 15, a0, a1)}" fill="none" stroke="${p.color}" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>`;
      }
      // Min–Max-Klammern außen, ab Segmentanfang
      for (const g of segList(st)) {
        if (g.maxPctV - g.minPctV < 0.002) continue;
        const a0 = g.a0 + g.minPctV * 360 * 0 + (g.minPctV / g.pct) * (g.a1 - g.a0) * 0.999, a1 = g.a0 + (g.maxPctV / g.pct) * (g.a1 - g.a0);
        const lo = Math.min(a0, a1), hi = Math.max(a0, a1);
        s += `<path d="${arcPath(cx, cy, r + 11, lo, hi)}" fill="none" stroke="${g.color}" stroke-width="2"/>`;
        for (const a of [lo, hi]) { const [x0, y0] = pol(cx, cy, r + 8, a), [x1, y1] = pol(cx, cy, r + 14, a); s += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${g.color}" stroke-width="2"/>`; }
        const [dx, dy] = pol(cx, cy, r + 11, g.a1); s += `<circle cx="${dx}" cy="${dy}" r="2.6" fill="#ede9f5"/>`;
      }
      return `<svg class="chart" viewBox="0 0 160 156">${s}${centerKm(st, cx, cy)}</svg>`;
    },
  },
  i2: {
    name: "2 · Plaketten-Tachos",
    notes: `<h2>2 · Jede Plakette ein kleiner Tacho</h2><p>Die runden Symbol-Plaketten aus Variante 4 werden zu Mini-Anzeigen: Um jedes Symbol läuft ein Bogen von <b>Minimum</b> (links) bis <b>Maximum</b> (rechts) in Euro, eine helle Marke zeigt den <b>aktuellen</b> Wert, ein kleiner Strich den <b>Vormonat</b>. Daneben sitzt der Trendpfeil im 10°-Raster.</p>
      <h3>Vorteile</h3><ul class="plus"><li>Jede Kategorie hat ihre eigene, sofort lesbare Mini-Skala</li><li>Trend direkt am Ring sichtbar</li></ul><h3>Nachteile</h3><ul class="minus"><li>Viele kleine Details – auf 360 px Breite an der Grenze</li></ul>`,
    keys: `<span>Bogen um Symbol = Min → Max</span><span>● aktuell · ┃ Vormonat · ➚ Trend</span>`,
    draw(st, k) {
      const cx = 80, cy = 80, r = 50, w = 12;
      let s = baseRing(st, cx, cy, r, w, k, false);
      for (const g of segList(st)) {
        if (g.pct < 0.05) continue;
        const [ix, iy] = pol(cx, cy, r, (g.a0 + g.a1) / 2), R = 13;
        s += `<circle cx="${ix}" cy="${iy}" r="${R}" fill="#17141f" stroke="${g.color}" stroke-opacity=".35" stroke-width="1.2"/>` + icon(g.key, ix, iy, 11, g.color, 2.2);
        // Skala 225° (links unten) bis 135° (rechts unten) über oben
        const t = (v) => (g.maxEur === g.minEur ? 0.5 : (v - g.minEur) / (g.maxEur - g.minEur));
        const ang = (f) => -135 + f * 270;
        s += `<path d="${arcPath(ix, iy, R + 3, -135, 135)}" fill="none" stroke="${g.color}" stroke-width="2.4" stroke-linecap="round"/>`;
        if (g.prevEur !== null) { const [a, b] = pol(ix, iy, R + 0.5, ang(t(g.prevEur))), [c, d] = pol(ix, iy, R + 6, ang(t(g.prevEur))); s += `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#a89fbf" stroke-width="1.6"/>`; }
        const [mx, my] = pol(ix, iy, R + 3, ang(t(g.eur))); s += `<circle cx="${mx}" cy="${my}" r="2.8" fill="#ede9f5"/>`;
        const [tx, ty] = pol(ix, iy, R + 13, 90 + 0); s += `<g transform="translate(${ix + R} ${iy - 8}) scale(.68)">${arrow(g.deg, 24).replace(/<\/?svg[^>]*>/g, "")}</g>`;
      }
      return `<svg class="chart" viewBox="0 0 160 160">${s}${centerKm(st, cx, cy)}</svg>`;
    },
  },
  i3: {
    name: "3 · Spannweiten-Leiste",
    notes: `<h2>3 · Ring + Spannweiten-Leiste</h2><p>Der Ring bleibt wie Variante 4. Darunter steht je Kategorie eine kleine Leiste: Die Strecke reicht vom <b>Minimum</b> bis zum <b>Maximum</b> (Euro), ein Dreieck ▼ markiert den <b>Vormonat</b>, der leuchtende Punkt den <b>aktuellen</b> Monat, rechts der Trendpfeil. Wie ein vereinfachter Boxplot.</p>
      <h3>Vorteile</h3><ul class="plus"><li>Statistisch am klarsten, auch für kleine Posten</li><li>Ring bleibt unverändert und ruhig</li></ul><h3>Nachteile</h3><ul class="minus"><li>Karte wird etwas höher (5 Zeilen à 14 px)</li></ul>`,
    keys: `<span>Strecke = Min–Max</span><span>▼ Vormonat · ● aktuell · ➚ Trend</span>`,
    draw(st, k) {
      const cx = 80, cy = 70, r = 50, w = 13;
      let rows = "";
      for (const p of PARTS) {
        const g = st.parts[p.key];
        const t = (v) => (g.maxEur === g.minEur ? 50 : 6 + ((v - g.minEur) / (g.maxEur - g.minEur)) * 88);
        const bar = g.constant
          ? `<svg viewBox="0 0 100 10" width="100%" height="12"><line x1="6" y1="5" x2="94" y2="5" stroke="${p.color}" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/><text x="50" y="8" text-anchor="middle" class="lbl" style="font-size:7px">${g.eur ? "konstant" : "–"}</text></svg>`
          : `<svg viewBox="0 0 100 10" width="100%" height="12"><line x1="6" y1="5" x2="94" y2="5" stroke="${p.color}" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/><line x1="6" y1="5" x2="94" y2="5" stroke="${p.color}" stroke-width="1.2"/>${g.prevEur !== null ? `<path d="M${t(g.prevEur) - 3} 0 h6 l-3 4Z" fill="#a89fbf"/>` : ""}<circle cx="${t(g.eur)}" cy="5" r="3.2" fill="#ede9f5" stroke="${p.color}" stroke-width="1.4"/></svg>`;
        rows += `<div class="rg">${svgIcon(p.key, p.color)}${bar}<span>${arrow(g.deg, 14)}</span></div>`;
      }
      return `<svg class="chart" viewBox="0 0 160 140">${baseRing(st, cx, cy, r, w, k)}${centerKm(st, cx, cy)}</svg><div class="ranges">${rows}</div>`;
    },
  },
  i4: {
    name: "4 · Drehring mit Mittelanzeige",
    notes: `<h2>4 · Drehring: die Mitte wird zur Anzeige</h2><p>Antippen eines <b>Segments</b> dreht es nach oben und zeigt in der Ringmitte genau diese Kategorie: aktueller Wert (€ und %), Vormonat, Min/Max und Trendpfeil. Ein dünner Zeiger-Bogen innen zeigt, wo der Wert zwischen Min und Max liegt. Antippen der <b>Mitte</b> öffnet den vollständigen Text für alle Kategorien.</p>
      <h3>Vorteile</h3><ul class="plus"><li>Sehr aufgeräumt, keine zusätzlichen Linien</li><li>Spielerisch, passt zur Gamification der App</li></ul><h3>Nachteile</h3><ul class="minus"><li>Immer nur eine Kategorie gleichzeitig auf einen Blick</li></ul>`,
    keys: `<span>Segment antippen = Kategorie in die Mitte</span><span>Mitte antippen = alle Werte</span>`,
    draw(st, k) {
      const cx = 80, cy = 80, r = 60, w = 13, f = st.parts[state.focus[k]] || st.parts.laden;
      const segs = segList(st), sel = segs.find((x) => x.key === f.key) || segs[0];
      const rot = -((sel.a0 + sel.a1) / 2);
      let ring = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2a2038" stroke-width="${w}"/>`;
      for (const g of segs) {
        const gap = g.pct > 0.03 ? 4 : 0.5, a0 = g.a0 + gap, a1 = Math.max(a0 + 0.5, g.a1 - gap), on = g.key === sel.key;
        ring += `<path class="seg" data-focus="${k}:${g.key}" d="${arcPath(cx, cy, r, a0, a1)}" fill="none" stroke="${g.color}" stroke-opacity="${on ? 1 : 0.45}" stroke-width="${on ? w + 4 : w}" stroke-linecap="round"/>`;
      }
      const t = sel.maxEur === sel.minEur ? 0.5 : (sel.eur - sel.minEur) / (sel.maxEur - sel.minEur);
      let s = `<g style="transition:transform .5s" transform="rotate(${rot} ${cx} ${cy})">${ring}</g>`;
      s += `<path d="${arcPath(cx, cy, r - 15, -60, 60)}" fill="none" stroke="#2a2038" stroke-width="4" stroke-linecap="round"/>`;
      s += `<path d="${arcPath(cx, cy, r - 15, -60, -60 + 120 * Math.max(0.02, t))}" fill="none" stroke="${sel.color}" stroke-width="4" stroke-linecap="round"/>`;
      s += `<text class="lbl" x="${pol(cx, cy, r - 15, -66)[0]}" y="${pol(cx, cy, r - 15, -66)[1] + 3}" text-anchor="end">min</text><text class="lbl" x="${pol(cx, cy, r - 15, 66)[0]}" y="${pol(cx, cy, r - 15, 66)[1] + 3}">max</text>`;
      s += `<g data-open="${k}" style="cursor:pointer"><circle cx="${cx}" cy="${cy}" r="${r - 22}" fill="#17141f" fill-opacity=".001"/>` + icon(sel.key, cx, cy - 22, 13, sel.color, 2.2)
        + `<text class="c1" x="${cx}" y="${cy + 1}" text-anchor="middle" font-size="12.5">${nf(sel.eur)} €</text>`
        + `<text class="c2" x="${cx}" y="${cy + 11}" text-anchor="middle">${Math.round(sel.pct * 100)} % · Vormonat ${sel.prevEur !== null ? nf(sel.prevEur, 0) + " €" : "–"}</text>`
        + `<g transform="translate(${cx - 8} ${cy + 15}) scale(.68)">${arrow(sel.deg, 24).replace(/<\/?svg[^>]*>/g, "")}</g></g>`;
      return `<svg class="chart" viewBox="0 0 160 160">${s}</svg>`;
    },
  },
  i5: {
    name: "5 · Jahresringe",
    notes: `<h2>5 · Jahresringe wie bei einem Baum</h2><p>Jeder bisherige Monat ist ein eigener dünner Ring, der älteste innen, der <b>aktuelle</b> außen in voller Breite. Der Ring direkt darunter ist der <b>Vormonat</b>. Der Monat mit den niedrigsten Gesamtkosten hat eine grüne, der mit den höchsten eine rote Kontur (<b>Min/Max</b>). Man sieht, wie sich die Aufteilung über die Zeit verschiebt.</p>
      <h3>Vorteile</h3><ul class="plus"><li>Zeigt die ganze Geschichte in einer Grafik</li><li>Ungewöhnlich und schön – passt zum „Wachsen“ der Daten</li></ul><h3>Nachteile</h3><ul class="minus"><li>Nach 36 Monaten sehr viele dünne Ringe (dann nur die letzten 6 zeigen)</li><li>Min/Max hier je Monat insgesamt, je Kategorie erst im Text</li></ul>`,
    keys: `<span>außen = aktuell · innen = ältere Monate</span><span><b style="color:#4caf94">○</b> günstigster · <b style="color:#e2664a">○</b> teuerster Monat</span>`,
    draw(st, k) {
      const cx = 80, cy = 78, h = HIST[k];
      const minI = st.totals.slice(0, CUR + 1).indexOf(Math.min(...st.totals.slice(0, CUR + 1)));
      const maxI = st.totals.slice(0, CUR + 1).indexOf(Math.max(...st.totals.slice(0, CUR + 1)));
      let s = "";
      for (let i = 0; i <= CUR; i++) {
        const sti = stats(k, i), r = 26 + i * 9 + (i === CUR ? 4 : 0), w = i === CUR ? 11 : 6;
        if (i === minI || i === maxI) s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${i === minI ? "#4caf94" : "#e2664a"}" stroke-width="${w + 4}" stroke-opacity=".9"/>`;
        s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#17141f" stroke-width="${w}"/>`;
        for (const g of segList(sti)) {
          const gap = i === CUR ? 3 : 1.5, a0 = g.a0 + gap, a1 = Math.max(a0 + 0.5, g.a1 - gap);
          s += `<path d="${arcPath(cx, cy, r, a0, a1)}" fill="none" stroke="${g.color}" stroke-opacity="${i === CUR ? 1 : 0.35 + i * 0.12}" stroke-width="${w}" stroke-linecap="${i === CUR ? "round" : "butt"}"/>`;
        }
        s += `<text class="lbl" x="${cx + 3}" y="${cy - r + 2.6}" style="font-size:6px">${MONTHS[i].label.slice(0, 3)}</text>`;
      }
      return `<svg class="chart" viewBox="0 0 160 156">${s}</svg>`;
    },
  },
};

function card(k) {
  const st = stats(k), h = HIST[k];
  return `<div class="card ${k}">
    <div class="name ${k}">${h.name} <span style="font-family:var(--mono);font-size:10px;opacity:.8">${h.code}</span></div>
    <div class="hero">${nf(st.tco, 3)}<small>€/km TCO</small></div>
    <div class="sub">${nf(st.ladenKm, 3)} <span>€/km Laden</span></div>
    <button type="button" class="chartbtn" data-open="${state.v === "i4" ? "" : k}" aria-label="Statistik ${h.name}">${IDEAS[state.v].draw(st, k)}</button>
    <div class="tap">${state.v === "i4" ? "Mitte antippen = alle Werte" : "Ring antippen = Statistik"}</div>
  </div>`;
}

function sheet(k) {
  const st = stats(k), h = HIST[k];
  const rows = PARTS.map((p) => {
    const g = st.parts[p.key];
    const fmt = (e, pc) => `<b>${nf(e)} €</b> · ${Math.round(pc * 100)} %`;
    const trendTxt = g.dev === null ? "–" : Math.abs(g.dev) < 0.025 ? "gleich" : `${g.dev > 0 ? "+" : "−"}${Math.round(Math.abs(g.dev) * 100)} %`;
    return `<div class="stat"><span class="ic" style="background:${p.color}">${svgIcon(p.key, "#17141f", 16, 2)}</span>
      <div><div class="t">${p.label}</div><div class="r">
        Aktueller Wert: ${fmt(g.eur, g.pct)} [${MONTHS[CUR].end}]<br>
        Vormonat: ${g.prevEur !== null ? fmt(g.prevEur, g.prevPct) + ` [${MONTHS[CUR - 1].end}]` : "–"}<br>
        ${g.constant
          ? `Betrag gleichbleibend: <b>${nf(g.eur)} €</b><br>`
          : `Minimaler Wert: <b>${nf(g.minEur)} €</b> [${g.minDate}]<br>Maximaler Wert: <b>${nf(g.maxEur)} €</b> [${g.maxDate}]<br>`}
        Anteil min: <b>${Math.round(g.minPctV * 100)} %</b> [${g.minPctDate}] · max: <b>${Math.round(g.maxPctV * 100)} %</b> [${g.maxPctDate}]
      </div></div>
      <div><div class="trend">${arrow(g.deg, 24)}</div><div class="trend-txt">${trendTxt}</div></div></div>`;
  }).join("");
  return `<div class="sheet-bg" data-close="1"><div class="sheet ${k}" onclick="event.stopPropagation()">
    <h3 class="name ${k}">${h.name} · Statistik ${MONTHS[CUR].label} 2026</h3>
    <div class="sh-sub">Gesamt ${nf(st.total)} € · Min/Max über alle bisherigen Monate · Trend: gegen Ø der letzten 3 Monate</div>
    ${rows}
    <button class="close" data-close="1">Schließen</button></div></div>`;
}

function render() {
  document.getElementById("sw").innerHTML = Object.entries(IDEAS).map(([k, v]) => `<button data-v="${k}" aria-pressed="${state.v === k}">${v.name}</button>`).join("");
  document.getElementById("phone").innerHTML = `<div class="monthbar">◀ &nbsp; OKTOBER 2026 &nbsp; ▶</div>
    <div class="cols">${card("b10")}${card("t03")}</div>
    <div class="keys">${IDEAS[state.v].keys}</div>
    <div class="legend">${PARTS.map((p) => `<span>${svgIcon(p.key, p.color)}${p.label}</span>`).join("")}</div>
    ${state.sheet ? sheet(state.sheet) : ""}`;
  document.getElementById("notes").innerHTML = `<span class="sample">Alle Zahlen sind Beispielwerte (Juli–Oktober 2026)</span>${IDEAS[state.v].notes}
    <h3>Gilt für alle Ideen</h3>
    <ul><li>Antippen öffnet ein Statistik-Blatt für alle Kategorien: aktueller Wert, Vormonat, minimaler und maximaler Wert, jeweils Euro und Anteil mit Monatsletztem [TT.MM.JJ]</li>
    <li>Gleichbleibende Posten (Leasing, Versicherung) zeigen „gleichbleibend“ statt Min/Max</li></ul>
    <h3>Trendpfeil</h3>
    <div class="formula">Abweichung = aktueller Monat ÷ Ø der 3 Vormonate − 1
unter ±2,5 %  →  waagerecht (gleich)
je 5 %        →  10° steiler, höchstens 90°
hoch = teurer (rot), runter = günstiger (grün)</div>
    <div style="display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap">${[-90, -40, -10, 0, 10, 40, 90].map((d) => `<span style="text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink-soft)">${arrow(d, 22)}<br>${d > 0 ? "+" : ""}${d}°</span>`).join("")}</div>`;
}

document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-v]");
  if (v) { state.v = v.dataset.v; state.sheet = null; return render(); }
  if (e.target.closest("[data-close]")) { state.sheet = null; return render(); }
  const f = e.target.closest("[data-focus]");
  if (f) { const [k, key] = f.dataset.focus.split(":"); state.focus[k] = key; return render(); }
  const o = e.target.closest("[data-open]");
  if (o && o.dataset.open) { state.sheet = o.dataset.open; render(); }
});
render();
</script>
</body>
</html>
